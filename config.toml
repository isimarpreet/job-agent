# Settings for the company job board search. Think of it as application.yml.

# A job is kept if its TITLE contains any of these. An empty list keeps every job.
keywords = ["java","python", "backend", "spring"]

# Public boards to read. The board name is the last part of the company's board
# URL, in lower case. These three are examples: replace them with your targets.
greenhouse_boards = ["gitlab"]
lever_boards = ["palantir", "spotify"]
